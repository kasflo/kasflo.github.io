<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IP Risk Check</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #000;
      color: white;
      padding: 20px;
    }

    .box {
      width: 90%;
      max-width: 420px;
      background: #111;
      padding: 20px;
      border-radius: 16px;
      margin-top: 20px;
      text-align: center;
      border: 2px solid #222;
    }

    .riskBox {
      margin-top: 20px;
      padding: 18px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: bold;
    }

    .green { background: #0a4; border: 2px solid #0f6; }
    .yellow { background: #ca0; border: 2px solid #fd0; }
    .red { background: #a00; border: 2px solid #f22; }

    button {
      width: 90%;
      max-width: 340px;
      padding: 16px;
      margin: 10px 0;
      font-size: 17px;
      border: none;
      border-radius: 12px;
      background: #007aff;
      color: white;
      cursor: pointer;
    }

    button:active {
      opacity: 0.7;
    }

    .loader {
      margin-top: 20px;
      color: #888;
      font-size: 16px;
    }
  </style>
</head>

<body>

  <h2>🔍 IP & Risk Analyse</h2>

  <div id="infoBox" class="box">
    <p><b>IP:</b> <span id="ip">Lade...</span></p>
    <p><b>Latitude:</b> <span id="lat">-</span></p>
    <p><b>Longitude:</b> <span id="lon">-</span></p>
    <p><b>Trust Score:</b> <span id="trust">-</span></p>
    <p><b>Risk Level:</b> <span id="risk">-</span></p>

    <div id="riskBox" class="riskBox">Warte auf Daten...</div>
  </div>

  <button id="copyIP">IP kopieren</button>
  <button id="copyLat">Latitude kopieren</button>
  <button id="copyLong">Longitude kopieren</button>
  <button id="copyScore">Score kopieren</button>

  <script>
    let lat, lon, ip, trustScore, riskLevel;
    let realLat, realLon; // echte Koordinaten intern

    const API_KEY = "0NZfP48YNIz1Z-ICI9yTYi7N7.tpsVWPSNyP6NlLPC87WN18EoGWHtbdmfGOC1kQ";

    const ipSpan = document.getElementById("ip");
    const latSpan = document.getElementById("lat");
    const lonSpan = document.getElementById("lon");
    const trustSpan = document.getElementById("trust");
    const riskSpan = document.getElementById("risk");
    const riskBox = document.getElementById("riskBox");

    // Erzeugt einen Punkt in zufälliger Richtung und Distanz (2–3 km) vom Original
    function getOffsetCoordinate(latDeg, lonDeg, minKm = 2, maxKm = 3) {
      const R = 6371000; // Meter
      const lat1 = (latDeg * Math.PI) / 180;
      const lon1 = (lonDeg * Math.PI) / 180;

      const distance = (minKm + Math.random() * (maxKm - minKm)) * 1000; // 2–3 km
      const bearing = Math.random() * 2 * Math.PI; // Richtung 0..2π
      const dr = distance / R;

      const lat2 = Math.asin(
        Math.sin(lat1) * Math.cos(dr) +
        Math.cos(lat1) * Math.sin(dr) * Math.cos(bearing)
      );

      const lon2 =
        lon1 +
        Math.atan2(
          Math.sin(bearing) * Math.sin(dr) * Math.cos(lat1),
          Math.cos(dr) - Math.sin(lat1) * Math.sin(lat2)
        );

      let newLat = (lat2 * 180) / Math.PI;
      let newLon = (lon2 * 180) / Math.PI;

      // Lon normalisieren auf [-180, 180]
      newLon = ((newLon + 540) % 360) - 180;

      return { lat: newLat, lon: newLon };
    }

    async function loadData() {
      try {
        // 1. IP & GEO laden
        const geo = await fetch("https://ipapi.co/json/").then(r => r.json());
        ip = geo.ip;

        // echte Werte intern speichern
        realLat = parseFloat(geo.latitude);
        realLon = parseFloat(geo.longitude);

        // Lat/Lon versetzen (2–3 km) und diese Werte dann anzeigen + kopieren
        const off = getOffsetCoordinate(realLat, realLon, 2, 3);
        lat = off.lat.toFixed(6);
        lon = off.lon.toFixed(6);

        ipSpan.textContent = ip;
        latSpan.textContent = lat;
        lonSpan.textContent = lon;

        // 2. APIVoid Risk Score
        const url = `https://endpoint.apivoid.com/iprep/v1/pay-as-you-go/?key=${API_KEY}&ip=${ip}`;
        const apivoid = await fetch(url).then(r => r.json());

        trustScore = apivoid.data.report.score;
        riskLevel = apivoid.data.report.risk_level;

        trustSpan.textContent = trustScore;
        riskSpan.textContent = riskLevel;

        // 3. Warnstufen Farbbox
        if (riskLevel === "low") {
          riskBox.className = "riskBox green";
          riskBox.textContent = "🟢 Niedriges Risiko";
        } else if (riskLevel === "medium") {
          riskBox.className = "riskBox yellow";
          riskBox.textContent = "🟡 Mittleres Risiko";
        } else {
          riskBox.className = "riskBox red";
          riskBox.textContent = "🔴 HOHES RISIKO!";
        }

      } catch (err) {
        console.error(err);

        // Nur die Fehlermeldung entfernen:
        // Kein "Fehler beim Laden..." Text mehr.
        // Optional: rot markieren, aber leer lassen.
        riskBox.className = "riskBox red";
        riskBox.textContent = "";
      }
    }

    loadData();

    function copy(text) {
      if (text === undefined || text === null || text === "") return;
      navigator.clipboard.writeText(text.toString()).catch(console.error);
    }

    document.getElementById("copyIP").addEventListener("click", () => copy(ip));
    document.getElementById("copyLat").addEventListener("click", () => copy(lat));   // versetzt
    document.getElementById("copyLong").addEventListener("click", () => copy(lon)); // versetzt
    document.getElementById("copyScore").addEventListener("click", () => copy(trustScore));
  </script>

</
