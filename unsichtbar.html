<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unsichtbare Zeichen</title>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0f1220;
      color: #fff;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 600px;
      margin: auto;
      background: #171a2e;
      border-radius: 16px;
      padding: 20px;
    }
    textarea, select {
      width: 100%;
      border-radius: 12px;
      border: none;
      padding: 12px;
      font-size: 1rem;
      margin-bottom: 10px;
    }
    textarea { min-height: 120px; resize: vertical; }
    button {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      border-radius: 12px;
      border: none;
      background: #6c7cff;
      color: #fff;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Unsichtbare Zeichen Generator</h2>

    <textarea id="input" placeholder="Text eingeben …"></textarea>

    <select id="level">
      <option value="1">Stufe 1</option>
      <option value="2">Stufe 2</option>
      <option value="3">Stufe 3</option>
      <option value="4">Stufe 4</option>
      <option value="5">Stufe 5</option>
    </select>

    <button onclick="processAndCopy()">Generieren & Kopieren</button>
  </div>

  <script>
    // Pro Stufe EIN iOS-/Hinge-stabiles Zeichen
    const LEVEL_CHAR = {
      1: "\u2060", // WORD JOINER
      2: "\u200C", // ZWNJ
      3: "\u200D", // ZWJ
      4: "\u2063", // INVISIBLE SEPARATOR
      5: "\u2062"  // INVISIBLE TIMES
    };

    function injectBeforeEveryLetter(text, level) {
      const chInvisible = LEVEL_CHAR[level];
      let result = "";

      for (const ch of text) {
        if (/\p{L}/u.test(ch)) {
          // VOR jedem Buchstaben: zufällig 2 ODER 3 unsichtbare Zeichen
          const count = Math.random() < 0.5 ? 2 : 3;
          result += chInvisible.repeat(count);
        }
        result += ch;
      }
      return result;
    }

    async function processAndCopy() {
      const text = document.getElementById("input").value;
      const level = document.getElementById("level").value;

      const output = injectBeforeEveryLetter(text, level);
      await navigator.clipboard.writeText(output);
      alert("✅ In die Zwischenablage kopiert");
    }
  </script>
</body>
</html>
