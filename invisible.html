<script>
  const INVISIBLE_CHARS = ["\u2060", "\u200C"]; // iOS-sicher

  function injectBetweenLetters(text, minK = 2, maxK = 3) {
    let result = "";

    for (let i = 0; i < text.length; i++) {
      const current = text[i];
      const next = text[i + 1];

      result += current;

      // NUR wenn aktuelles + nächstes Zeichen Buchstaben sind
      if (
        next &&
        /\p{L}/u.test(current) &&
        /\p{L}/u.test(next)
      ) {
        const k = Math.floor(Math.random() * (maxK - minK + 1)) + minK;
        for (let j = 0; j < k; j++) {
          result += INVISIBLE_CHARS[Math.floor(Math.random() * INVISIBLE_CHARS.length)];
        }
      }
    }

    return result;
  }

  async function processAndCopy() {
    const input = document.getElementById("input").value;
    const output = injectBetweenLetters(input);

    await navigator.clipboard.writeText(output);
    alert("✅ In Zwischenablage kopiert");
  }
</script>
